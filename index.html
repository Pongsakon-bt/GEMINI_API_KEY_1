<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Motion Quiz V2 - Cyberpunk Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- Document Handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <style>
        body { font-family: 'Kanit', sans-serif; overflow: hidden; background-color: #0f172a; color: white; }
        .mirror-mode { transform: scaleX(-1); }
        .progress-fill { transition: height 0.1s linear; }
        .text-fit { font-size: clamp(0.875rem, 1.5vw, 1.25rem); line-height: 1.2; }
        .quiz-item.selected { border-color: #06b6d4; background-color: rgba(6, 182, 212, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-[#131c31]">

    <!-- หน้าจอโหลด -->
    <div id="initial-loader" class="fixed inset-0 z-[999] bg-[#131c31] flex flex-col items-center justify-center">
        <h2 class="text-white text-2xl font-bold animate-pulse">กำลังโหลดภาพและระบบ...</h2>
    </div>

    <!-- หน้าแรก -->
    <div id="home-screen" class="absolute inset-0 z-[70] hidden flex-col items-center justify-center bg-[#131c31]">
        <img src="https://img5.pic.in.th/file/secure-sv1/Gemini_Generated_Image_pbrn3dpbrn3dpbrn.png" class="max-h-[70vh] mb-8 rounded-3xl shadow-2xl">
        <button onclick="startGameFlow()" class="px-16 py-6 bg-pink-600 hover:bg-pink-500 rounded-full font-black text-4xl text-white shadow-[0_0_30px_rgba(236,72,153,0.5)] transition-all">START</button>
    </div>

    <!-- หน้าสร้างข้อสอบ -->
    <div id="content-screen" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-slate-900/90 hidden p-4">
        <div class="bg-slate-900 p-8 rounded-3xl border border-cyan-500/30 shadow-2xl w-full max-w-2xl text-center">
            <h2 class="text-3xl font-bold text-cyan-300 mb-6">ระบุหัวข้อข้อสอบ 🤖</h2>
            <textarea id="prompt-input" rows="3" class="w-full bg-white/5 border border-white/20 rounded-xl p-4 mb-6 text-white text-lg" placeholder="เช่น วิทยาศาสตร์ ป.4, ประวัติศาสตร์ไทย..."></textarea>
            <button onclick="generateFromPrompt()" class="w-full py-4 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold text-2xl transition">สร้างข้อสอบทันที</button>
        </div>
    </div>

    <div id="motion-container" class="fixed inset-0 z-0 pointer-events-none">
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror-mode opacity-30" autoplay playsinline></video>
        <canvas id="output-canvas" class="absolute inset-0 w-full h-full object-cover mirror-mode opacity-40"></canvas>
    </div>

    <script>
        let state = { step: 'HOME', rawQuestions: [] };

        window.startGameFlow = () => {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('content-screen').classList.remove('hidden');
        };

        async function generateFromPrompt() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) return;

            document.getElementById('initial-loader').classList.remove('hidden');
            try {
                const res = await fetch('/api/generate-quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                
                if (!res.ok) throw new Error("Backend Error");
                const data = await res.json();
                
                // จัดการแสดงผล (โค้ดจำลองเพื่อให้เห็นภาพ)
                alert("สร้างข้อสอบสำเร็จ! พบ " + (data.questions?.length || 0) + " ข้อ");
                // คุณสามารถนำโค้ดจัดการแสดงผลเดิมมาใส่ต่อตรงนี้ได้เลย
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                document.getElementById('initial-loader').classList.add('hidden');
            }
        }

        window.onload = () => {
            document.getElementById('initial-loader').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('home-screen').classList.add('flex');
        };
    </script>
</body>
</html>
